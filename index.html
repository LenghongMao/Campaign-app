<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campaigns</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between mb-3">
        <h2>Campaign List</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#campaignModal">Add Campaign</button>
    </div>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Name</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Channel</th>
                <th>Detail Link</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="campaignTableBody"></tbody>
    </table>

    <!-- Add Campaign Modal -->
    <div class="modal fade" id="campaignModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">New Campaign</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="cName" class="form-control mb-2" placeholder="Campaign Name">
                    <input type="date" id="cStart" class="form-control mb-2" placeholder="Start Date">
                    <input type="date" id="cEnd" class="form-control mb-2" placeholder="End Date">
                    <input type="text" id="cChannel" class="form-control mb-2" placeholder="Channel (e.g. Email, Social)">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-success" onclick="saveCampaign()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function getCampaigns() {
            return JSON.parse(localStorage.getItem('campaigns')) || [];
        }

        function loadCampaigns() {
            const campaigns = getCampaigns();
            const tbody = document.getElementById('campaignTableBody');
            tbody.innerHTML = '';
            campaigns.forEach(c => {
                tbody.innerHTML += `
                    <tr>
                        <td>${c.name}</td>
                        <td>${c.startDate}</td>
                        <td>${c.endDate}</td>
                        <td>${c.channel}</td>
                        <td><a href="detail.html?id=${c.id}">View Details (${c.id})</a></td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteCampaign('${c.id}')">Delete</button></td>
                    </tr>
                `;
            });
        }

        function saveCampaign() {
            const campaigns = getCampaigns();
            const newCampaign = {
                id: Date.now().toString(),
                name: document.getElementById('cName').value,
                startDate: document.getElementById('cStart').value,
                endDate: document.getElementById('cEnd').value,
                channel: document.getElementById('cChannel').value
            };
            campaigns.push(newCampaign);
            localStorage.setItem('campaigns', JSON.stringify(campaigns));
            
            document.querySelector('.btn-close').click();
            loadCampaigns();
        }

        function deleteCampaign(id) {
            if(confirm("Delete this campaign?")) {
                let campaigns = getCampaigns();
                campaigns = campaigns.filter(c => c.id !== id);
                localStorage.setItem('campaigns', JSON.stringify(campaigns));
                loadCampaigns();
            }
        }

        loadCampaigns();
    </script>
</body>
</html>
