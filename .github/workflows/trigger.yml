name: Trigger E2E Tests

on:
  push:
    branches:
      - main
      
jobs:
  ping-test-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Required to compare against the previous commit
          
      - name: Analyze Commit and Set Tag
        id: analyze
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "index.html detail.html")
          
          GREP_TAG=""
          
          if [[ "$COMMIT_MSG" == *"[Test_all]"* ]]; then
            echo "Flag [Test_all] detected. Running all tests."
            GREP_TAG=""
          elif [[ "$CHANGED_FILES" == *"index.html"* && "$CHANGED_FILES" == *"detail.html"* ]]; then
            echo "Both pages changed. Running all tests."
            GREP_TAG=""
          elif [[ "$CHANGED_FILES" == *"index.html"* ]]; then
            echo "Only index changed. Tagging @index."
            GREP_TAG="@index"
          elif [[ "$CHANGED_FILES" == *"detail.html"* ]]; then
            echo "Only detail changed. Tagging @detail."
            GREP_TAG="@detail"
          fi
          
          echo "grep_tag=$GREP_TAG" >> $GITHUB_ENV
          
      - name: Wait for GitHub Pages Deployment
        run: sleep 90
        
      - name: Ping Test Repository
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TEST_TRIGGER_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/LenghongMao/campaign-app-tests/dispatches \
            -d "{\"event_type\": \"run-playwright\", \"client_payload\": { \"grep_tag\": \"${{ env.grep_tag }}\" }}"