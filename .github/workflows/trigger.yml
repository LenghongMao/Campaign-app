name: Trigger E2E Tests

on:
  push:
    branches:
      - main
      
jobs:
  ping-test-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Required to compare against the previous commit
          
      - name: Analyze Commit and Set Tag
        id: analyze
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "index.html detail.html")
          
          GREP_TAG=""
          SCOPE_MSG=""
          
          # 1. Check for the forced override first
          if [[ "$COMMIT_MSG" == *"[Test_all]"* ]]; then
            echo "grep_tag=" >> $GITHUB_ENV
            echo "scope_msg=All Tests (Forced via [Test_all] flag)" >> $GITHUB_ENV
            exit 0
          fi
          
          # 2. Dynamically build tags for ANY changed HTML files
          for FILE in $CHANGED_FILES; do
            if [[ "$FILE" == *.html ]]; then
              # Get just the name (e.g., "index" from "index.html")
              PAGE_NAME=$(basename "$FILE" .html)
              
              # Append it to our regex string and message string
              GREP_TAG+="@${PAGE_NAME}|"
              SCOPE_MSG+="${PAGE_NAME}, "
            fi
          done
          
          # 3. Clean up the trailing '|' and ', ' from the loops
          GREP_TAG=${GREP_TAG%|}
          SCOPE_MSG=${SCOPE_MSG%, }
          
          # 4. Finalize the variables
          if [ -z "$GREP_TAG" ]; then
            echo "grep_tag=" >> $GITHUB_ENV
            echo "scope_msg=All Tests (No specific HTML files changed)" >> $GITHUB_ENV
          else
            echo "grep_tag=$GREP_TAG" >> $GITHUB_ENV
            echo "scope_msg=Dynamic Scope: $SCOPE_MSG" >> $GITHUB_ENV
          fi
          
      - name: Wait for GitHub Pages Deployment
        run: sleep 90
        
      - name: Ping Test Repository
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TEST_TRIGGER_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/LenghongMao/campaign-app-tests/dispatches \
            -d "{\"event_type\": \"run-playwright\", \"client_payload\": { \"grep_tag\": \"${{ env.grep_tag }}\" }}"