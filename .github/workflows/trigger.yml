name: Trigger E2E Tests

on:
  push:
    branches:
      - main
      
jobs:
  ping-test-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to see the full history of the push
          
      - name: Analyze Commit and Set Tag
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          # Compare the state before the push vs after the push
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || echo "index.html detail.html")
          
          # 1. Forced Override
          if [[ "$COMMIT_MSG" == *"[Test_all]"* ]]; then
            echo "grep_tag=" >> $GITHUB_ENV
            echo "scope_msg=Full Suite (All 3 Tests)" >> $GITHUB_ENV
            exit 0
          fi
          
          # 2. Check which files changed
          HAS_INDEX=false
          HAS_DETAIL=false
          
          if [[ "$CHANGED_FILES" == *"index.html"* ]]; then HAS_INDEX=true; fi
          if [[ "$CHANGED_FILES" == *"detail.html"* ]]; then HAS_DETAIL=true; fi
          
          # 3. Set exact tags and Slack messages
          if [ "$HAS_INDEX" = true ] && [ "$HAS_DETAIL" = true ]; then
            echo "grep_tag=@index|@detail" >> $GITHUB_ENV
            echo "scope_msg=Campaign and Campaign Detail (@index, @detail)" >> $GITHUB_ENV
            
          elif [ "$HAS_INDEX" = true ]; then
            echo "grep_tag=@index" >> $GITHUB_ENV
            echo "scope_msg=Campaign List Only (@index)" >> $GITHUB_ENV
            
          elif [ "$HAS_DETAIL" = true ]; then
            echo "grep_tag=@detail" >> $GITHUB_ENV
            echo "scope_msg=Campaign Detail Only (@detail)" >> $GITHUB_ENV
            
          else
            echo "grep_tag=" >> $GITHUB_ENV
            echo "scope_msg=Full Suite (All 3 Tests)" >> $GITHUB_ENV
          fi
          
      - name: Wait for GitHub Pages Deployment
        run: sleep 30
        
      - name: Ping Test Repository
        run: |
          # Securely build the payload using standard bash variables
          PAYLOAD=$(jq -n \
            --arg gt "$grep_tag" \
            --arg sm "$scope_msg" \
            '{event_type: "run-playwright", client_payload: {grep_tag: $gt, scope_msg: $sm}}')
            
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TEST_TRIGGER_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/LenghongMao/campaign-app-tests/dispatches \
            -d "$PAYLOAD"