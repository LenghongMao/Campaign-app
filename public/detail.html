<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campaign Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <a href="index.html" class="btn btn-outline-secondary mb-3">Back to Campaigns</a>
    
    <div class="d-flex justify-content-between mb-3">
        <h2 id="pageTitle">Campaign Products</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal">Add Product</button>
    </div>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Item Number</th>
                <th>Item Name</th>
                <th>Category</th>
                <th>Description</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody id="productTableBody"></tbody>
    </table>

    <!-- Add Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">New Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="pNumber" class="form-control mb-2" placeholder="Item Number">
                    <input type="text" id="pName" class="form-control mb-2" placeholder="Item Name">
                    <input type="text" id="pCategory" class="form-control mb-2" placeholder="Category">
                    <input type="text" id="pDesc" class="form-control mb-2" placeholder="Description">
                    <input type="number" id="pQty" class="form-control mb-2" placeholder="Quantity">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-success" onclick="saveProduct()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Get Campaign ID from URL (e.g., detail.html?id=12345)
        const urlParams = new URLSearchParams(window.location.search);
        const campaignId = urlParams.get('id');
        document.getElementById('pageTitle').innerText = `Products for Campaign: ${campaignId}`;

        async function loadProducts() {
            const res = await fetch(`/api/products/${campaignId}`);
            const products = await res.json();
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '';
            products.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.itemNumber}</td>
                        <td>${p.itemName}</td>
                        <td>${p.category}</td>
                        <td>${p.description}</td>
                        <td>${p.quantity}</td>
                    </tr>
                `;
            });
        }

        async function saveProduct() {
            const data = {
                campaignId: campaignId, // Ties product to this specific campaign
                itemNumber: document.getElementById('pNumber').value,
                itemName: document.getElementById('pName').value,
                category: document.getElementById('pCategory').value,
                description: document.getElementById('pDesc').value,
                quantity: document.getElementById('pQty').value
            };
            await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            document.querySelector('.btn-close').click();
            loadProducts();
        }

        loadProducts();
    </script>
</body>
</html>
